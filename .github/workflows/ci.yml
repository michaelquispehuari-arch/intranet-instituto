name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: intranet_instituto_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d intranet_instituto_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/intranet_instituto_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci_jwt_secret_123456789012345678901234
      FRONTEND_URL: http://localhost:3000
      NODE_ENV: test
      CLOUDFLARE_R2_ACCOUNT_ID: ci_account
      CLOUDFLARE_R2_ACCESS_KEY_ID: ci_access_key
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ci_secret_key
      CLOUDFLARE_R2_BUCKET_NAME: ci-bucket
      SMTP_HOST: smtp.example.com
      SMTP_PORT: 587
      SMTP_USER: ci_user
      SMTP_PASS: ci_password
      SMTP_FROM: no-reply@example.com

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npm run prisma:validate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Seed database
        run: npm run prisma:seed

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Integration tests
        run: npm run test:integration

      - name: Audit production dependencies
        run: npm audit --omit=dev

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    env:
      BACKEND_URL: http://localhost:4000
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ci_nextauth_secret_12345678901234567890

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev
